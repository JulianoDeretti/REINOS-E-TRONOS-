<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — Kings or Thrones</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/medieval.css">
</head>
<body data-scene="castle">
<div class="screen">
  <div class="crest-eyebrow"><span class="rule"></span>KINGS OR THRONES<span class="rule flip"></span></div>
  <h1 class="brand-title auth-title">Retorne ao seu reino</h1>
  <p class="brand-sub">Seus súditos aguardam suas ordens.</p>

  <div class="parchment-panel auth-panel">
    <span class="panel-corner tl"></span><span class="panel-corner tr"></span>
    <span class="panel-corner bl"></span><span class="panel-corner br"></span>

    <div id="alert" class="alert alert-error"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="identifier">E-mail ou usuário</label>
        <input type="text" id="identifier" name="identifier" placeholder="arthur@reino.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
        <span id="submitLabel">Entrar no reino</span>
      </button>
    </form>

    <p class="link-line">Ainda não fundou seu reino? <a href="register.html">Criar conta</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/fx.js"></script>
</body>
</html>
